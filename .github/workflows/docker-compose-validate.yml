name: Docker Compose Validate

# No paths filter here, deliberately: this workflow's `test` job is the required
# status check on main. A filtered workflow simply never reports on a PR that touches
# none of its paths, and a required check that never reports blocks the merge forever.
# Running it on every PR costs ~3 minutes; use setup-script-validate for path-scoped
# infrastructure checks that are not required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # Fixed version, not ubuntu-latest — that tag moves to a newer image over time
    # without notice, risking non-reproducible CI runs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests
        run: ./gradlew test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: build/reports/tests/test/

  validate:
    # Fixed version, not ubuntu-latest — that tag moves to a newer image over time
    # without notice, risking non-reproducible CI runs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check application is reachable
        run: curl --fail -L http://localhost:8080/

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
